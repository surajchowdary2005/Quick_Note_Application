<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quick Note Application</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>📝 Quick Note Application</h1>

        <p class="subtitle">
            Write your notes quickly and easily.
        </p>

        <div class="note-box">

            <input
                type="text"
                id="noteInput"
                placeholder="Enter your note..."
            >

            <button id="addNoteButton">
                Add Note
            </button>

        </div>

        <h2>📋 My Notes</h2>

        <div id="notesContainer">
            <!-- Notes will appear here -->
        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
